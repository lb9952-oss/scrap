name: Retrain Model

# [중요] 변경된 모델 파일을 저장소에 올리기 위한 쓰기 권한 부여
permissions:
  contents: write

on:
  # 'labeled_for_training.csv' 파일이 푸시되면 실행
  push:
    paths:
      - 'labeled_for_training.csv'
  
  # 수동 실행 옵션
  workflow_dispatch:

jobs:
  retrain-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Konlpy 실행을 위한 자바 환경 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 수정된 파이썬 스크립트 실행
      - name: Run Model Retraining Script
        run: python run_daily_retraining.py

      # 변경 사항(재학습된 모델, 누적 데이터) 커밋
      - name: Commit new model and data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: Retrain model with new labeled data'
          file_pattern: '*.pkl historical_scraps.csv'
